# To install the git hooks run:
#   prek install
# To update the hooks run:
#   prek autoupdate
# See https://prek.j178.dev/configuration/#configuration-file for more details on the configuration options
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit.git"
rev = "321478e58f4938179c6b86e4ddfa923d1547a49b"  # frozen: v0.16.6
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
  { id = "ruff-format" }
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=10240"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "743d21e292f7a36ed70cc2318aa3c8711b1e0437"  # frozen: v0.0.78
hooks = [
  { id = "ty" },
]

[[repos]]
repo = "https://github.com/Lucas-C/pre-commit-hooks.git"
rev = "ad1b27d73581aa16cca06fc4a0761fc563ffe8e8"  # frozen: v1.5.6
hooks = [
  { id = "remove-crlf" }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks.git"
rev = "3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316"  # frozen: v1.10.0
hooks = [
  { id = "python-use-type-annotations" },
  { id = "text-unicode-replacement-char" }
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "d43b6c087ac471e2ea7b8af622ff15f05c0c365b"  # frozen: v1.50.1
hooks = [
  { id = "typos", args = ["--force-exclude"], exclude = ".pdf|.svg|.graphml" }
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-bash-syntax", name = "check bash syntax", language = "system", entry = "bash -n", files = '\.sh$' }
]
